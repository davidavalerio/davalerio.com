# Writing and Maps by Email: sends one piece or map page when run by hand
# (_writing/send.py). Nothing runs on publish. Run it from the Actions tab's
# Run button, or `gh workflow run newsletter.yml -f name=<name> -f to=test`;
# a test goes to David alone, and only `to=subscribers` mails the list.
name: Writing and Maps by Email

on:
  workflow_dispatch:
    inputs:
      name:
        description: Slug of the piece, or name of the map page
        required: true
      to:
        description: Who receives it
        type: choice
        options: [test, subscribers]
        default: test

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y pandoc && pip install pyyaml
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEGMENT_ID: ${{ secrets.SEGMENT_ID }}
          NAME: ${{ inputs.name }}
          TO: ${{ inputs.to }}
        run: |
          if [ "$TO" = subscribers ]; then
            python3 _writing/send.py "$NAME" --subscribers
          else
            python3 _writing/send.py "$NAME"
          fi
