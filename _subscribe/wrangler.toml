# The signup service for Writing by Email. Deployed by hand from this
# folder with `npx wrangler deploy`; secrets RESEND_API_KEY, SEGMENT_ID and
# SIGNING_KEY are set with `wrangler secret put` (see the site's CLAUDE.md).
name = "davalerio-subscribe"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "subscribe.davalerio.com", custom_domain = true }]

# At most 5 posts a minute from one address on the internet, to the form and
# to the confirm button alike.
[[ratelimits]]
name = "LIMIT_IP"
namespace_id = "4631"
  [ratelimits.simple]
  limit = 5
  period = 60

# Caps (see worker.js): one confirmation email per address a day and the
# day's count, as fingerprints only.
[[durable_objects.bindings]]
name = "CAPS"
class_name = "Caps"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[[migrations]]
tag = "v2"
deleted_classes = ["Ledger"]
new_sqlite_classes = ["Caps"]
