# The Missouri and the Yellowstone. Tiles are built by missouri-yellowstone.py beside this file,
# from the Williston Confluence project in Drive (1-Practice/GIS/Williston Confluence).
title: The Missouri and the Yellowstone
date: 2026-11-22
page: true
note: The Missouri from its meeting with the Yellowstone to Williston and the head of Lake Sakakawea, drawn in lines alone, contours on the bluffs and waterlines stepping in from the shore. Drag to move, scroll to zoom, and right-drag or two-finger drag to tilt and turn.
start: above
credits: "Elevation: USGS 3D Elevation Program. Hydrography: USGS National Hydrography Dataset. Streets: North Dakota NG911 road centerlines."
bounds: [-104.6, 47.75, -103.15, 48.62]
exaggeration: 2

sources:
  vectors: {type: vector, url: vectors.pmtiles}
  terrain: {type: raster-dem, url: terrain.pmtiles, encoding: terrarium, tileSize: 256, maxzoom: 12}

# Every line carries `fade`, 1 inside the drawing and falling to 0 at its edge.
layers:
  - id: waterlines
    type: line
    source: vectors
    source-layer: waterlines
    paint:
      line-color: --map-water
      line-width: 0.6
      line-opacity: ["*", [get, fade], [match, [get, step], 1, 0.85, 2, 0.62, 0.42]]
  - id: shoreline
    type: line
    source: vectors
    source-layer: shoreline
    paint: {line-color: --map-water, line-width: 1.1, line-opacity: ["*", [get, fade], 1]}
  - id: contours
    type: line
    source: vectors
    source-layer: contours
    # Every 100 feet at small scales, every 50 from zoom 11
    filter: [step, [zoom], [==, ["%", [get, elev_ft], 100], 0], 11, true]
    paint:
      line-color: --map-contour
      line-width: [case, [==, [get, index], 1], 1.05, 0.5]
      line-opacity: ["*", [get, fade], [case, [==, [get, index], 1], 1, 0.75]]
  - id: streams
    type: line
    source: vectors
    source-layer: streams
    paint: {line-color: --map-water, line-width: 0.8, line-opacity: ["*", [get, fade], 0.9]}
  - id: streets
    type: line
    source: vectors
    source-layer: streets
    paint: {line-color: --map-city-line, line-width: 0.5, line-opacity: ["*", [get, fade], 0.85]}

labels:
  williston: {text: Williston, at: [-103.625, 48.168], kind: place}
  missouri: {text: Missouri River, at: [-103.793, 48.0186], kind: water}
  upper: {text: Missouri River, at: [-104.2406, 48.0488], kind: water}
  yellowstone: {text: Yellowstone River, at: [-103.99, 47.963], kind: water}
  sakakawea: {text: Lake Sakakawea, at: [-103.4445, 48.0155], kind: water}
  muddy: {text: Little Muddy River, at: [-103.5977, 48.1867], kind: water}

views:
  above:
    center: [-103.977, 48.2087]
    zoom: 9.35
    terrain: true
    show: [waterlines, shoreline, contours, streams, streets, williston, missouri, upper, yellowstone, sakakawea]
    alt: Line drawing seen from above of the Missouri River winding east from the west edge, joined by the Yellowstone from the south, past the delta at Williston to the head of Lake Sakakawea, with contours crowding the bluffs south of the river.
    caption: The Missouri from the Yellowstone to Lake Sakakawea, contours every 100 feet.
  williston:
    center: [-103.665, 48.128]
    zoom: 11.3
    show: [waterlines, shoreline, contours, streams, streets, williston, missouri, muddy]
    alt: Closer view of Williston's street grid on the bluffs north of the Missouri, the river's islands and channels below, contours every 50 feet.
    caption: Williston above the river, contours every 50 feet.
  tilted:
    center: [-103.9, 48.17]
    zoom: 9.9
    pitch: 52
    bearing: -35
    terrain: true
    show: [waterlines, shoreline, contours, streams, streets, williston, upper, yellowstone, sakakawea]
    alt: The drawing tilted and looking northwest, the river running across the foreground from the Yellowstone's mouth to Williston and the lake, relief exaggerated twice.
    caption: Looking northwest along the river, relief exaggerated twice.
