    fill-opacity: 0.95
- id: hillshade
  type: hillshade
  source: relief
  paint: {hillshade-shadow-color: --map-shadow, hillshade-highlight-color: --map-highlight, hillshade-accent-color: --map-shadow, hillshade-exaggeration: 0.4}
- id: counties
  type: line
  source: vectors
  source-layer: counties
  paint: {line-color: --map-city-line, line-width: 0.5, line-opacity: 0.55}
- id: ice-known
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - all
  - - ==
    - [get, kind]
    - Ice Margin
  - - ==
    - [get, certainty]
    - Known
  paint: {line-color: '#9A3324', line-width: 1.2}
- id: ice-uncertain
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - all
  - - ==
    - [get, kind]
    - Ice Margin
  - - '!='
    - [get, certainty]
    - Known
  paint:
    line-color: '#9A3324'
    line-width: 1.2
    line-dasharray: [3, 2]
- id: erratics
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - ==
  - [get, kind]
  - Erratic Margin
  layout: {line-cap: round}
  paint:
    line-color: '#3E4A55'
    line-width: 1.4
    line-dasharray: [0.1, 2.2]
- id: eskers
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - ==
  - [get, kind]
  - Esker
  paint: {line-color: '#2F6E8F', line-width: 1.2}
- id: towns
  type: circle
  source: vectors
  source-layer: towns
  paint: {circle-radius: 2.6, circle-color: --ink, circle-stroke-color: --paper, circle-stroke-width: 1}
