# Byzantine Catholic Parishes. Tiles are built by byzantine-parishes.py beside this file,
# from the Byzantine Catholic Parishes project in Drive. Group colors are the print map's.
title: 'Byzantine-Rite Catholic Parishes of the United States'
date: '2026-11-14'
page: true
note: 'Byzantine-Rite Catholic parishes, missions, and communities in the United States, colored by church and eparchy, over the coal fields of the lower 48.'
start: country
credits: |-
  Parish records compiled from eparchy directories, [GCatholic.org](https://gcatholic.org/) and parish websites, checked 2026-11-14.

  Coal fields: U.S. Geological Survey, [Coal Fields of the Conterminous United States](https://doi.org/10.3133/ofr20121205) (East, 2013, Open-File Report 2012-1205).

  State boundaries: U.S. Census Bureau, [2025 Cartographic Boundary Files](https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.2025.html), States, 1:500,000.
bounds: [-179, 12, -50, 73]
sources:
  vectors: {type: vector, url: vectors.pmtiles}
layers:
- id: coal
  type: fill
  source: vectors
  source-layer: coal
  paint:
    fill-color:
    - match
    - [get, rank]
    - Anthracite
    - --map-coal-anthracite
    - [Low Volatile Bituminous, Medium and High Volatile Bituminous]
    - --map-coal-bituminous
    - Subbituminous
    - --map-coal-subbituminous
    - --map-coal-lignite
- id: states
  type: line
  source: vectors
  source-layer: states
  paint: {line-color: --map-contour, line-width: 0.7}
- id: parishes
  type: circle
  source: vectors
  source-layer: parishes
  paint:
    circle-color:
    - match
    - [get, grp]
    - 'Ruthenian: Pittsburgh'
    - '#B27C10'
    - 'Ruthenian: Passaic'
    - '#C25E1B'
    - 'Ruthenian: Parma'
    - '#B03F27'
    - 'Ruthenian: Phoenix'
    - '#8C2C39'
    - Ukrainian
    - '#1F6FA8'
    - Melkite
    - '#2C8878'
    - Romanian
    - '#6A4FA0'
    - Other
    - '#56616F'
    - '#56616F'
    circle-radius:
    - interpolate
    - [linear]
    - [zoom]
    - 3
    - 3
    - 8
    - 6.5
    circle-stroke-color: --paper
    circle-stroke-width: 0.8
popup:
  layer: parishes
  title: '{name}'
  lines: ['{city}, {state}', '{eparchy}', '{sunday_liturgy}']
views:
  country:
    center: [-96.5, 38.6]
    zoom: 3.9
    show: [coal, states, parishes]
    alt: Map of the United States with Byzantine Catholic parishes as colored points over gray coal fields, the points thickest on and around the Appalachian
      coal fields from Ohio and Pennsylvania to New York and New Jersey, and scattered across Florida, Texas, Arizona and California.
    caption: The Byzantine Catholic parishes of the United States.
  northeast:
    center: [-77.6, 41.2]
    zoom: 5.7
    show: [coal, states, parishes]
    alt: Closer view from Ohio to New England over the coal fields, Ruthenian parishes clustered on the bituminous field of western Pennsylvania and Ukrainian
      and Ruthenian parishes on the small dark anthracite fields of eastern Pennsylvania, with more in New Jersey and New York.
    caption: From Ohio to New England, where most of the parishes are.
legend:
- heading: Coal Fields
  items:
  - {shape: fill, color: --map-coal-anthracite, label: Anthracite}
  - {shape: fill, color: --map-coal-bituminous, label: Bituminous}
  - {shape: fill, color: --map-coal-subbituminous, label: Subbituminous}
  - {shape: fill, color: --map-coal-lignite, label: Lignite}
- heading: Ruthenian
  items:
  - {shape: dot, color: '#B27C10', label: Pittsburgh}
  - {shape: dot, color: '#C25E1B', label: Passaic}
  - {shape: dot, color: '#B03F27', label: Parma}
  - {shape: dot, color: '#8C2C39', label: Phoenix}
- heading: Other Churches
  items:
  - {shape: dot, color: '#1F6FA8', label: Ukrainian}
  - {shape: dot, color: '#2C8878', label: Melkite}
  - {shape: dot, color: '#6A4FA0', label: Romanian}
  - {shape: dot, color: '#56616F', label: 'Italo-Albanian, Russian, Belarusian'}
