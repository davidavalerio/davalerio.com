# The Basin, Exploded: a print map, shown as a turnable model with its image and PDF.
# Rebuilt in Drive (1-Practice/GIS/Basin Exploded/Scripts/build.sh), which writes the PNG, the PDF and the model's
# Web folder; copy the PNG and PDF here and the Web folder's contents into maps/basin-exploded/model/ when it changes.
title: The Basin, Exploded
date: 2026-11-22
page: true
note: Five surfaces of the Williston Basin, from the ground down to the Precambrian basement, cut as a core 196 miles across near McKenzie County, North Dakota, and lifted apart, with relief exaggerated 20 times. A plumb line from Watford City carries the depths.
image: basin-exploded.png
alt: Five round, floating sheets stacked one above another, showing the ground surface, the Pierre Shale, the Bakken Formation, the Red River Formation and the Precambrian basement beneath western North Dakota, each sagging into the basin's low under McKenzie County, with a vertical line from Watford City dropping through all five.
pdf: basin-exploded.pdf
model: model
credits: "Data: Gelman and Johnson, 2023, data release for the USGS three-dimensional petroleum systems model of the Williston Basin (doi:10.5066/P9N7O1OT)."
