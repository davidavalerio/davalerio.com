# The Williston Basin, Exposed: a turnable model, with the print's image for print and for browsers that can't draw it.
# Rebuilt in Drive (`build` below, under 1-Practice/GIS; Scripts/build.sh), which writes the PNG, the PDF and the model's
# Web folder; copy the PNG here and the Web folder's .bin, .jpg and model.json into maps/basin-exploded/model/ when it
# changes. Its settings are tuned in the workbench (_writing/workbench).
title: 'The Williston Basin, Exposed'
date: 2026-11-22
page: true
note: 'Five geologic units of the Williston Basin, from surface to basement. Cut as a core 196 miles across and lifted apart, with relief exaggerated 20 times. A well bore from Watford City marks the depths.'
image: basin-exploded.png
alt: Five round, floating sheets stacked one above another, showing the ground surface, the Pierre Shale, the Bakken Formation, the Red River Formation and the Precambrian basement beneath western North Dakota, each sagging into the basin's low under McKenzie County, with a vertical line from Watford City dropping through all five.
model: model
build: Basin Exploded
credits: "Data: Gelman and Johnson, 2023, data release for the USGS three-dimensional petroleum systems model of the Williston Basin (doi:10.5066/P9N7O1OT)."
