# Williston and the Missouri. Tiles are built by williston-missouri.py beside this file.
title: Williston and the Missouri
date: 2026-11-22
page: true
note: The city of Williston on the north bluffs of the Missouri River valley, Williams County, North Dakota, with 20-foot contours and the valley in relief.
hint: Drag to move, scroll to zoom, and right-drag or two-finger drag to tilt and turn.
start: relief
credits: "Elevation: USGS 3D Elevation Program. Hydrography: USGS National Hydrography Dataset. City limits: U.S. Census Bureau TIGER."
bounds: [-103.86, 48.0, -103.39, 48.27]
exaggeration: 3

sources:
  vectors: {type: vector, url: vectors.pmtiles}
  terrain: {type: raster-dem, url: terrain.pmtiles, encoding: terrarium, tileSize: 256, maxzoom: 13}
  relief: {type: raster-dem, url: terrain.pmtiles, encoding: terrarium, tileSize: 256, maxzoom: 13}

# Colors written as --name are read from the page's map palette (maps/map.css),
# so they follow light and dark mode.
layers:
  - id: hillshade
    type: hillshade
    source: relief
    paint:
      hillshade-shadow-color: --map-shadow
      hillshade-highlight-color: --map-highlight
      hillshade-accent-color: --map-shadow
      hillshade-exaggeration: 0.55
  - id: city
    type: fill
    source: vectors
    source-layer: city
    paint: {fill-color: --map-city, fill-opacity: 0.35}
  - id: contours
    type: line
    source: vectors
    source-layer: contours
    paint:
      line-color: --map-contour
      line-width: [case, [==, ["%", [get, elev_ft], 100], 0], 1.1, 0.45]
      line-opacity: [case, [==, ["%", [get, elev_ft], 100], 0], 0.9, 0.6]
  - id: streams
    type: line
    source: vectors
    source-layer: streams
    paint: {line-color: --map-water, line-width: [interpolate, [linear], [zoom], 10, 0.6, 14, 1.4]}
  - id: water
    type: fill
    source: vectors
    source-layer: waterbodies
    paint: {fill-color: --map-water}
  - id: rivers
    type: fill
    source: vectors
    source-layer: rivers
    paint: {fill-color: --map-water}
  - id: city-line
    type: line
    source: vectors
    source-layer: city
    paint: {line-color: --map-city-line, line-width: 1.2, line-dasharray: [3, 2]}

labels:
  williston: {text: Williston, at: [-103.6454, 48.1751], kind: place}
  missouri: {text: Missouri River, at: [-103.657, 48.0903], kind: water}
  muddy: {text: Little Muddy River, at: [-103.5982, 48.1907], kind: water}

views:
  locator:
    center: [-103.627, 48.132]
    zoom: 11.3
    show: [city, streams, water, rivers, city-line, williston, missouri, muddy]
    alt: Flat map of Williston, its city limits dashed, on the north side of the Missouri River, with the Little Muddy River joining from the north.
    caption: Williston and the Missouri River.
  contours:
    center: [-103.63, 48.145]
    zoom: 11.9
    show: [city, contours, streams, water, rivers, city-line, williston, missouri]
    alt: The same area with 20-foot contours, crowded into bands along the valley sides and spread thin on the valley floor and the upland.
    caption: Contours every 20 feet, heavier every 100.
  relief:
    center: [-103.64, 48.134]
    zoom: 11.9
    pitch: 64
    bearing: -18
    terrain: true
    show: [hillshade, city, contours, streams, water, rivers, city-line, williston, missouri]
    alt: The valley tilted into relief, looking north across the Missouri River to Williston on the bluffs, relief exaggerated three times.
    caption: Looking north across the river, relief exaggerated three times.
