    zoom: 6.25
    terrain: true
    show: [units, hillshade, counties, ice-known, ice-uncertain, erratics, eskers, towns, bismarck, minot, williston, dickinson, lake-sakakawea,
      missouri-river, little-missouri-river, yellowstone-river]
    alt: 'Western North Dakota colored by surface geology: greens and blues of glacial sediment north and east of the Missouri River, tans and
      oranges of Paleocene bedrock in the southwest, with the ice margin and the limit of glacial erratics drawn across the state.'
    caption: Western North Dakota, west of 100.5° W.
  missouri:
    center: [-102.75, 47.75]
    zoom: 8.1
