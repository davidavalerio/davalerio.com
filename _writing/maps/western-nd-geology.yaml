legend:
- heading: Oahe Formation · Holocene
  items:
  - {code: Qor, color: '#FBF1B8', label: 'River sediment: overbank clay and sand over channel sand'}
  - {code: Qod, color: '#F3DC74', label: Windblown sand in dunes}
  - {code: Qol, color: '#EBDFB2', label: Windblown silt}
  - {code: Qop, color: '#DBE8E3', label: Pond sediment in ephemeral ponds}
  - {code: ls, color: '#D9B79C', label: Landslide deposits}
- heading: Coleharbor Group · Pleistocene
  items:
  - {code: Qccg, color: '#DBE9C9', label: 'Collapsed glacial sediment, gently undulating'}
  - {code: Qccu, color: '#C2DCAC', label: 'Collapsed glacial sediment, undulating'}
  - {code: Qccr, color: '#A4CB8E', label: 'Collapsed glacial sediment, rolling'}
  - {code: Qcch, color: '#80B373', label: 'Collapsed glacial sediment, hilly'}
  - {code: Qcdc, color: '#D4DEA0', label: Collapsed sediment draped over older topography}
  - {code: Qcdg, color: '#E5E9BF', label: Draped over older glacial topography}
  - {code: Qcdn, color: '#EEF0D8', label: Draped over nonglacial topography}
  - {code: Qcm, color: '#B3D5C4', label: On subglacially molded ridges and grooves}
  - {code: Qct, color: '#8FB9A5', label: On glacial thrust masses}
  - {code: Qcer, color: '#CDE2DC', label: Eroded by meltwater rivers}
  - {code: Qces, color: '#DFE8D2', label: Eroded by slopewash on valley sides}
  - {code: Qcew, color: '#C4DCE6', label: Eroded by waves}
  - {code: Qcoh, color: '#A9C4E0', label: Ice-walled-lake and collapsed lake sediment}
  - {code: Qcof, color: '#C8D8EE', label: Proglacial-lake sediment}
  - {code: Qcoe, color: '#B6BFE0', label: Eroded lake sediment on valley sides}
  - {code: Qcrf, color: '#F6D48A', label: River sediment of outwash plains and terraces}
  - {code: Qcrh, color: '#E9B466', label: Collapsed river sediment}
- heading: Pliocene to Holocene
  items:
  - {code: QTu, color: '#EADBC1', label: 'Terrace, fan and pediment sediment, undivided'}
  - {code: QTou, color: '#F2E19C', label: 'Windblown and older sand, undivided'}
- heading: Tertiary
  items:
  - {code: Tm, color: '#F6D2B8', label: 'Sandstone and limestone, Oligocene to Pliocene'}
  - {code: Tw, color: '#F0B39B', label: 'White River Group, Oligocene'}
  - {code: Tg, color: '#E3996B', label: 'Golden Valley Formation, Paleocene–Eocene'}
  - {code: Ts, color: '#CBB39D', label: 'Sentinel Butte Formation, Paleocene'}
  - {code: Tb, color: '#F0D79C', label: 'Bullion Creek Formation, Paleocene'}
  - {code: Tp, color: '#D9A982', label: 'Slope Formation, Paleocene'}
  - {code: Tc, color: '#AAB7A4', label: 'Cannonball Formation, Paleocene, marine'}
  - {code: Tl, color: '#C99271', label: 'Ludlow Formation, Paleocene'}
- heading: Cretaceous
  items:
  - {code: Kh, color: '#A3D0B6', label: Hell Creek Formation}
  - {code: Kf, color: '#7FBEA6', label: 'Fox Hills Formation, marine'}
  - {code: Kp, color: '#93AAA2', label: 'Pierre Formation, marine shale'}
- heading: Other
  items:
  - {color: '#BCD6E8', label: Water}
- heading: Glacial Features
  items:
  - {shape: line, color: '#9A3324', label: 'Ice margin, located'}
  - {shape: line, dash: dashed, color: '#9A3324', label: 'Ice margin, uncertain'}
  - {shape: line, dash: dotted, color: '#3E4A55', label: Limit of glacial erratics}
  - {shape: line, color: '#2F6E8F', label: Esker}
