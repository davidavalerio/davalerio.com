# Geologic Map of Western North Dakota. Tiles are built by western-nd-geology.py beside this file,
# from the Western North Dakota Geology project in Drive. Unit colors and legend wording are the print map's.
title: Geologic Map of Western North Dakota
date: '2026-11-17'
page: true
note: Surface geology of North Dakota west of 100.5° W, after Lee Clayton's 1:500,000 Geologic Map of North Dakota (1980), over shaded relief.
  Click a unit for its name; drag to move, scroll to zoom, and right-drag or two-finger drag to tilt and turn.
start: west
credits: 'Geology: North Dakota Geological Survey, Surface Geology after Clayton (1980), ND GIS Hub. Elevation: USGS 3D Elevation Program. Boundaries
  and towns: U.S. Census Bureau TIGER. Unit colors and legend wording condensed from the survey''s descriptions.'
bounds: [-106.3, 44.6, -99.3, 50.2]
exaggeration: 2
sources:
  vectors: {type: vector, url: vectors.pmtiles}
  terrain: {type: raster-dem, url: terrain.pmtiles, encoding: terrarium, tileSize: 256, maxzoom: 10}
  relief: {type: raster-dem, url: terrain.pmtiles, encoding: terrarium, tileSize: 256, maxzoom: 10}
layers:
- id: units
  type: fill
  source: vectors
  source-layer: units
  paint:
    fill-color:
    - match
    - [get, abbr]
    - Qor
    - '#FBF1B8'
    - Qod
    - '#F3DC74'
    - Qol
    - '#EBDFB2'
    - Qop
    - '#DBE8E3'
    - ls
    - '#D9B79C'
    - Qccg
    - '#DBE9C9'
    - Qccu
    - '#C2DCAC'
    - Qccr
    - '#A4CB8E'
    - Qcch
    - '#80B373'
    - Qcdc
    - '#D4DEA0'
    - Qcdg
    - '#E5E9BF'
    - Qcdn
    - '#EEF0D8'
    - Qcm
    - '#B3D5C4'
    - Qct
    - '#8FB9A5'
    - Qcer
    - '#CDE2DC'
    - Qces
    - '#DFE8D2'
    - Qcew
    - '#C4DCE6'
    - Qcoh
    - '#A9C4E0'
    - Qcof
    - '#C8D8EE'
    - Qcoe
    - '#B6BFE0'
    - Qcrf
    - '#F6D48A'
    - Qcrh
    - '#E9B466'
    - QTu
    - '#EADBC1'
    - QTou
    - '#F2E19C'
    - Tm
    - '#F6D2B8'
    - Tw
    - '#F0B39B'
    - Tg
    - '#E3996B'
    - Ts
    - '#CBB39D'
    - Tb
    - '#F0D79C'
    - Tp
    - '#D9A982'
    - Tc
    - '#AAB7A4'
    - Tl
    - '#C99271'
    - Kh
    - '#A3D0B6'
    - Kf
    - '#7FBEA6'
    - Kp
    - '#93AAA2'
    - water
    - '#BCD6E8'
    - '#EEEEEE'
    fill-opacity: 0.95
- id: hillshade
  type: hillshade
  source: relief
  paint: {hillshade-shadow-color: --map-shadow, hillshade-highlight-color: --map-highlight, hillshade-accent-color: --map-shadow, hillshade-exaggeration: 0.4}
- id: counties
  type: line
  source: vectors
  source-layer: counties
  paint: {line-color: --map-city-line, line-width: 0.5, line-opacity: 0.55}
- id: ice-known
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - all
  - - ==
    - [get, kind]
    - Ice Margin
  - - ==
    - [get, certainty]
    - Known
  paint: {line-color: '#9A3324', line-width: 1.2}
- id: ice-uncertain
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - all
  - - ==
    - [get, kind]
    - Ice Margin
  - - '!='
    - [get, certainty]
    - Known
  paint:
    line-color: '#9A3324'
    line-width: 1.2
    line-dasharray: [3, 2]
- id: erratics
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - ==
  - [get, kind]
  - Erratic Margin
  layout: {line-cap: round}
  paint:
    line-color: '#3E4A55'
    line-width: 1.4
    line-dasharray: [0.1, 2.2]
- id: eskers
  type: line
  source: vectors
  source-layer: glacial
  filter:
  - ==
  - [get, kind]
  - Esker
  paint: {line-color: '#2F6E8F', line-width: 1.2}
- id: towns
  type: circle
  source: vectors
  source-layer: towns
  paint: {circle-radius: 2.6, circle-color: --ink, circle-stroke-color: --paper, circle-stroke-width: 1}
