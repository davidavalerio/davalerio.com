<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/writing/style.css">
    <link rel="stylesheet" href="/maps/lib/maplibre-gl.css">
    <link rel="stylesheet" href="/maps/map.css">
    <link rel="stylesheet" href="/workbench/workbench.css">
    <script src="/maps/lib/pmtiles.js"></script>
    <script type="module" src="/workbench/workbench.js"></script>
</head>
<body>
    <header class="wb-bar">
        <select id="piece" aria-label="Piece"></select>
        <button type="button" id="save" disabled>Save</button>
        <button type="button" id="revert" disabled>Revert</button>
        <span id="status"></span>
    </header>
    <div class="wb-main">
        <main id="stage"></main>
        <aside id="panel"></aside>
    </div>
</body>
</html>
