<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Workbench</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="/writing/style.css">
    <link rel="stylesheet" href="/maps/lib/maplibre-gl.css">
    <link rel="stylesheet" href="/maps/map.css">
    <link rel="stylesheet" href="/workbench/workbench.css">
    <script src="/maps/lib/pmtiles.js"></script>
    <script type="module" src="/workbench/workbench.js"></script>
</head>
<body>
    <header class="wb-bar">
        <select id="piece" aria-label="Piece"></select>
        <span id="form" class="wb-form" hidden><button type="button" data-form="web">Web</button><button type="button" data-form="print">Print</button></span>
        <button type="button" id="save" disabled>Save</button>
        <button type="button" id="revert" disabled>Revert</button>
        <span id="status"></span>
    </header>
    <div class="wb-main">
        <main id="stage"></main>
        <aside id="panel"></aside>
    </div>
</body>
</html>
